name: Build AnySound.exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --windowed --name AnySound --collect-data imageio_ffmpeg --collect-all tkinterdnd2 anysound.py
      - uses: actions/upload-artifact@v4
        with:
          name: AnySound
          path: dist/AnySound.exe
