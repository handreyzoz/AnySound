name: Build AnySound
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --windowed --name AnySound --icon anysound.ico --add-data "anysound.ico;." --collect-data imageio_ffmpeg --collect-all tkinterdnd2 anysound.py
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Gerar instalador
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: AnySound-Setup
          path: dist/AnySound-Setup.exe
